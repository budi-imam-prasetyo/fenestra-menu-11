[package]
name = "fenestra_qml"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Optional CXX-Qt bridge exposing Fenestra Menu 11 domain logic to QML"

[lib]
crate-type = ["staticlib"]

[dependencies]
fenestra-core = { path = "../fenestra-core" }
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_qml", "qt_gui"] }
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
cxx-qt-build = "0.10"
